[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "runapi-producer"
version = "0.3.0"
description = "RunAPI Producer SDK for FUZZ exact-lyrics and instrumental music generation in JavaScript, Python, Ruby, Go, Java, and PHP"
readme = "README.md"
requires-python = ">=3.9"
license = "Apache-2.0"
authors = [{ name = "RunAPI", email = "contact@runapi.ai" }]
keywords = ["runapi", "runapi-ai", "producer", "fuzz", "api", "sdk", "typescript", "python", "ruby", "golang", "java", "maven", "gradle", "music-generation", "audio-generation", "music-api"]
dependencies = ["runapi-core>=0.3.0"]

[project.urls]
Homepage = "https://runapi.ai/models/producer"
Documentation = "https://runapi.ai/docs#sdk-producer"
Source = "https://github.com/runapi-ai/producer-sdk"
Issues = "https://github.com/runapi-ai/producer-sdk/issues"
Changelog = "https://github.com/runapi-ai/producer-sdk/blob/main/CHANGELOG.md"
"Release Notes" = "https://github.com/runapi-ai/producer-sdk/releases/tag/python%2Fv0.3.0"

[tool.hatch.build.targets.wheel]
packages = ["src/runapi"]

[tool.uv]
package = true

[dependency-groups]
dev = ["pytest>=8"]

[tool.runapi]
slug = "producer"
